<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ban cán sự – Trao đổi nội bộ</title>
<style>
:root{--v:#7c3aed;--p:#ec4899;--c:#06b6d4;--o:#f59e0b;--g:#10b981;--tx:#1e1b4b;--mt:#6b7280;--bd:#ede9fe;--sf:#fff}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:linear-gradient(135deg,#ede9fe 0%,#fce7f3 50%,#cffafe 100%);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:9px 16px;color:var(--tx);background:#f3f0ff;font-weight:600;transition:.15s}
button:hover{filter:brightness(.96)}
button.p{color:#fff;background:linear-gradient(135deg,var(--v),var(--p));box-shadow:0 4px 14px #7c3aed44}
button.sm{padding:6px 12px;font-size:13px}
button.w{background:#ffffff33;color:#fff}
button:disabled{opacity:.5;cursor:default}
input,textarea{font:inherit;color:var(--tx);background:#faf8ff;border:2px solid var(--bd);border-radius:12px;padding:10px 13px;width:100%;outline:0;transition:.15s}
input:focus,textarea:focus{border-color:var(--v);background:#fff}
textarea{resize:none}
/* đăng nhập */
#auth{min-height:100%;display:flex;align-items:center;justify-content:center;padding:18px}
.card{background:var(--sf);border-radius:24px;padding:28px 24px;width:min(400px,100%);box-shadow:0 20px 60px #7c3aed33}
.logo{width:64px;height:64px;border-radius:20px;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:32px;background:linear-gradient(135deg,var(--v),var(--p),var(--o))}
.card h1{text-align:center;margin:0 0 2px;font-size:22px;background:linear-gradient(90deg,var(--v),var(--p));-webkit-background-clip:text;background-clip:text;color:transparent}
.card .sub{text-align:center;color:var(--mt);margin:0 0 16px;font-size:13px}
.tabs{display:flex;background:#f3f0ff;border-radius:14px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;background:transparent;box-shadow:none;color:var(--mt)}
.tabs button.on{background:#fff;color:var(--v);box-shadow:0 2px 8px #7c3aed22}
.card form{display:flex;flex-direction:column;gap:10px}
.err{color:#e11d48;font-size:13px;min-height:18px;text-align:center}
.link{background:none;color:var(--v);padding:2px;font-size:13px;font-weight:500}
/* app */
#app{display:flex;height:100%;max-width:1200px;margin:0 auto;background:var(--sf);box-shadow:0 0 50px #7c3aed22}
aside{width:300px;border-right:2px solid var(--bd);display:flex;flex-direction:column;flex:none;background:#fff}
main{flex:1;display:flex;flex-direction:column;min-width:0;background:linear-gradient(180deg,#faf8ff,#fff)}
header{padding:13px 16px;display:flex;align-items:center;gap:8px;color:#fff;background:linear-gradient(135deg,var(--v),var(--p))}
header h1{font-size:17px;margin:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#me{padding:10px 16px;font-size:13px;color:var(--mt);border-bottom:2px solid var(--bd)}
#glist{overflow:auto;flex:1;padding:8px}
.g{display:flex;gap:11px;align-items:center;padding:10px 11px;border-radius:14px;cursor:pointer;margin-bottom:4px}
.g:hover{background:#faf8ff}
.g.on{background:linear-gradient(135deg,#ede9fe,#fce7f3)}
.av{width:42px;height:42px;border-radius:14px;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;font-size:17px}
.g b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g small{color:var(--mt)}
#msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:9px}
.m{max-width:min(78%,560px);background:#fff;border:2px solid var(--bd);border-radius:18px 18px 18px 4px;padding:8px 13px;align-self:flex-start}
.m.me{background:linear-gradient(135deg,var(--v),var(--p));color:#fff;border:0;border-radius:18px 18px 4px 18px;align-self:flex-end}
.m b{font-size:12px;display:block;color:var(--v)}
.m.me b{display:none}
.m span{white-space:pre-wrap;overflow-wrap:anywhere}
.m i{display:block;font-size:11px;font-style:normal;opacity:.65;text-align:right}
form.send{display:flex;gap:9px;padding:12px 14px;border-top:2px solid var(--bd);background:#fff;align-items:flex-end}
.empty{margin:auto;color:var(--mt);text-align:center;padding:24px}
.empty .big{font-size:44px}
/* hộp thoại */
.dlg{position:fixed;inset:0;background:#1e1b4b99;display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.dlg>div{background:#fff;border-radius:22px;padding:20px;width:min(440px,100%);max-height:88%;overflow:auto;display:flex;flex-direction:column;gap:11px;box-shadow:0 20px 60px #0004}
.dlg h2{margin:0;font-size:18px}
.chip{display:inline-flex;gap:6px;align-items:center;background:#f3f0ff;border-radius:99px;padding:4px 6px 4px 12px;margin:3px;font-size:13px;font-weight:500}
.chip button{padding:0 7px;border-radius:99px;background:#fff;color:#e11d48}
.hit{display:flex;gap:10px;align-items:center;padding:8px 10px;border:2px solid var(--bd);border-radius:14px}
.hit div.t{flex:1;min-width:0}
.hit small{color:var(--mt);display:block}
.note{font-size:12px;color:var(--mt)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--tx);color:#fff;padding:10px 18px;border-radius:99px;z-index:30;font-size:14px}
.pic{display:block;max-width:100%;max-height:320px;border-radius:12px;margin:4px 0;cursor:zoom-in}
.fc{display:flex;gap:10px;align-items:center;background:#f3f0ff;color:var(--tx);border-radius:12px;padding:8px 10px;margin:4px 0}
.m.me .fc{background:#ffffff2e;color:#fff}
.fc .fi{font-size:26px}
.fc .ft{flex:1;min-width:0}
.fc .ft strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fc small{opacity:.7}
.m.me .fc button{background:#fff;color:var(--v)}
button.clip{background:#f3f0ff;font-size:18px;padding:8px 12px}
#up{padding:6px 16px;background:#fff7ed;color:#c2410c;border-top:2px solid var(--bd)}
#back{display:none}
@media(max-width:700px){aside{width:100%}main{display:none}#app.chat aside{display:none}#app.chat main{display:flex}#back{display:inline-block}}
</style>
</head>
<body>

<div id="auth" hidden>
  <div class="card">
    <div class="logo">🔒</div>
    <h1>Ban cán sự</h1>
    <p class="sub">Nơi trao đổi thông tin nội bộ của lớp</p>
    <div class="tabs"><button id="tl" class="on" type="button">Đăng nhập</button><button id="tr" type="button">Đăng ký</button></div>
    <form id="af">
      <input id="an" placeholder="Họ và tên" autocomplete="name" hidden>
      <input id="ae" type="email" placeholder="Email" autocomplete="email" required>
      <input id="ap" type="password" placeholder="Mật khẩu (từ 6 ký tự)" autocomplete="current-password" required>
      <div class="err" id="aerr"></div>
      <button class="p" id="go">Đăng nhập</button>
      <button class="link" id="forgot" type="button">Quên mật khẩu?</button>
    </form>
  </div>
</div>

<div id="app" hidden>
  <aside>
    <header><h1>🔒 Ban cán sự</h1><button class="w sm" id="newg">+ Nhóm</button></header>
    <div id="me"></div>
    <div id="glist"></div>
    <div style="padding:10px 16px;border-top:2px solid var(--bd)"><button class="sm" id="out">Đăng xuất</button></div>
  </aside>
  <main>
    <header><button id="back" class="w sm">←</button><h1 id="gt">Chọn một nhóm</h1><button id="mem" class="w sm" hidden>👥 Thành viên</button></header>
    <div id="msgs"><div class="empty"><div class="big">💬</div>Chọn hoặc tạo một nhóm để bắt đầu trao đổi.</div></div>
    <div class="note" id="up" hidden></div>
    <form class="send" id="f" hidden><button type="button" class="clip" id="clip" title="Đính kèm ảnh hoặc tệp">📎</button><input type="file" id="fi" multiple hidden><textarea id="in" rows="1" placeholder="Nhập tin nhắn…"></textarea><button class="p">Gửi</button></form>
  </main>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,updateProfile,signOut,sendPasswordResetEmail} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,setDoc,getDoc,addDoc,updateDoc,deleteDoc,getDocs,onSnapshot,query,where,orderBy,limit,arrayUnion,arrayRemove} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC6m01xe4LfvgM7xW3oEzfjiK2sX-WuSIk",
  authDomain: "cvts-1901.firebaseapp.com",
  projectId: "cvts-1901",
  storageBucket: "cvts-1901.firebasestorage.app",
  messagingSenderId: "506932001286",
  appId: "1:506932001286:web:05d5377e6c96d52c722187"
};

const $=s=>document.querySelector(s);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
let me=null,myName="",groups=[],cur=null,unsubG=null,unsubM=null,names={},mode="login",pendingName="";

const COLORS=["#7c3aed","#ec4899","#06b6d4","#f59e0b","#10b981","#3b82f6","#ef4444"];
const color=s=>{let h=0;for(const ch of s)h=(h*31+ch.charCodeAt(0))>>>0;return COLORS[h%COLORS.length]};
const avatar=(name,id)=>{const a=el("div","av",(name||"?").trim().charAt(0).toUpperCase());a.style.background=`linear-gradient(135deg,${color(id||name)},${color((id||name)+"x")})`;return a};
const norm=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/đ/g,"d").trim();
const keysOf=n=>{const k=new Set();norm(n).split(/\s+/).filter(Boolean).forEach(w=>{for(let i=1;i<=Math.min(w.length,15);i++)k.add(w.slice(0,i))});return [...k]};
const toast=t=>{const x=el("div","toast",t);document.body.appendChild(x);setTimeout(()=>x.remove(),2600)};
const emsg=c=>({"auth/invalid-credential":"Sai email hoặc mật khẩu.","auth/wrong-password":"Sai mật khẩu.","auth/user-not-found":"Email này chưa đăng ký.","auth/email-already-in-use":"Email này đã đăng ký rồi.","auth/weak-password":"Mật khẩu cần ít nhất 6 ký tự.","auth/invalid-email":"Email không hợp lệ.","auth/too-many-requests":"Thử quá nhiều lần, hãy đợi một lát.","auth/network-request-failed":"Mất kết nối mạng."}[c]||("Có lỗi xảy ra ("+c+")."));

/* ---------- Đăng nhập / Đăng ký ---------- */
function setMode(m){
  mode=m;$("#tl").classList.toggle("on",m==="login");$("#tr").classList.toggle("on",m==="reg");
  $("#an").hidden=m!=="reg";$("#go").textContent=m==="reg"?"Tạo tài khoản":"Đăng nhập";
  $("#forgot").hidden=m==="reg";$("#aerr").textContent="";
  $("#ap").autocomplete=m==="reg"?"new-password":"current-password";
}
$("#tl").onclick=()=>setMode("login");$("#tr").onclick=()=>setMode("reg");
$("#af").onsubmit=async e=>{
  e.preventDefault();$("#aerr").textContent="";$("#go").disabled=true;
  const em=$("#ae").value.trim().toLowerCase(),pw=$("#ap").value;
  try{
    if(mode==="reg"){
      const n=$("#an").value.trim();
      if(!n){$("#aerr").textContent="Hãy nhập họ và tên.";return}
      pendingName=n;
      const c=await createUserWithEmailAndPassword(auth,em,pw);
      await updateProfile(c.user,{displayName:n});
      await saveProfile(c.user.uid,n,em);
    }else await signInWithEmailAndPassword(auth,em,pw);
  }catch(x){$("#aerr").textContent=emsg(x.code)}
  finally{$("#go").disabled=false}
};
$("#forgot").onclick=async()=>{
  const em=$("#ae").value.trim();
  if(!em){$("#aerr").textContent="Nhập email của bạn ở trên rồi bấm lại.";return}
  try{await sendPasswordResetEmail(auth,em);$("#aerr").style.color="#059669";$("#aerr").textContent="Đã gửi email đặt lại mật khẩu."}
  catch(x){$("#aerr").style.color="";$("#aerr").textContent=emsg(x.code)}
};
$("#out").onclick=()=>signOut(auth);

async function saveProfile(uid,name,email){
  await setDoc(doc(db,"users",uid),{name,nameKey:norm(name),keys:keysOf(name),email:email.toLowerCase()});
  names[uid]=name;myName=name;$("#me").textContent="👤 "+name;
}

onAuthStateChanged(auth,async u=>{
  if(unsubG){unsubG();unsubG=null}if(unsubM){unsubM();unsubM=null}
  cur=null;groups=[];
  if(!u){me=null;$("#app").hidden=true;$("#auth").hidden=false;return}
  me=u.uid;$("#auth").hidden=true;$("#app").hidden=false;
  try{
    const s=await getDoc(doc(db,"users",me));
    if(s.exists()&&s.data().keys){myName=s.data().name;names[me]=myName;$("#me").textContent="👤 "+myName}
    else await saveProfile(me,pendingName||u.displayName||u.email.split("@")[0],u.email);
  }catch(e){myName=u.displayName||u.email;$("#me").textContent="👤 "+myName}
  openG(null);
  unsubG=onSnapshot(query(collection(db,"groups"),where("members","array-contains",me)),s=>{
    groups=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.name||"").localeCompare(b.name||"","vi"));
    if(cur&&!groups.some(g=>g.id===cur))openG(null);
    renderG();if(cur)headFor();
  },()=>{$("#glist").replaceChildren(el("div","empty","Không có quyền đọc dữ liệu. Hãy kiểm tra quy tắc Firestore."))});
});

/* ---------- Nhóm & tin nhắn ---------- */
function renderG(){
  const l=$("#glist");l.replaceChildren();
  if(!groups.length){const d=el("div","empty");d.appendChild(el("div","big","✨"));d.appendChild(document.createTextNode("Bạn chưa thuộc nhóm nào. Bấm “+ Nhóm” để tạo."));l.appendChild(d);return}
  groups.forEach(g=>{
    const d=el("div","g"+(g.id===cur?" on":""));
    d.appendChild(avatar(g.name,g.id));
    const t=el("div");t.style.minWidth=0;t.appendChild(el("b",null,g.name));t.appendChild(el("small",null,(g.members||[]).length+" thành viên"));
    d.appendChild(t);d.onclick=()=>openG(g.id);l.appendChild(d);
  });
}
const headFor=()=>{const g=groups.find(x=>x.id===cur);if(g)$("#gt").textContent=g.name};

function openG(id){
  cur=id;if(unsubM){unsubM();unsubM=null}
  renderG();
  $("#app").classList.toggle("chat",!!id);
  $("#f").hidden=!id;$("#mem").hidden=!id;
  const box=$("#msgs");
  if(!id){$("#gt").textContent="Chọn một nhóm";box.replaceChildren(mkEmpty("💬","Chọn hoặc tạo một nhóm để bắt đầu trao đổi."));return}
  headFor();box.replaceChildren(mkEmpty("⏳","Đang tải…"));
  unsubM=onSnapshot(query(collection(db,"groups",id,"messages"),where("ts",">",0),orderBy("ts","asc")),s=>{
    box.replaceChildren();
    if(s.empty)box.appendChild(mkEmpty("👋","Chưa có tin nhắn nào. Hãy gửi lời chào!"));
    s.docs.forEach(d=>{const m=d.data();
      const x=el("div","m"+(m.uid===me?" me":""));
      x.appendChild(el("b",null,m.name));
      if(m.img){const im=el("img","pic");im.src=m.img;im.onclick=()=>viewImg(m.img);x.appendChild(im)}
      if(m.file){const fc=el("div","fc");fc.appendChild(el("div","fi",fIcon(m.file.type||"")));const t=el("div","ft");t.appendChild(el("strong",null,m.file.name));t.appendChild(el("small",null,fmtSize(m.file.size)));fc.appendChild(t);const bt=el("button","sm","⬇ Tải");bt.onclick=()=>download(id,d.id,m.file,bt);fc.appendChild(bt);x.appendChild(fc)}
      if(m.text)x.appendChild(el("span",null,m.text));
      x.appendChild(el("i",null,new Date(m.ts).toLocaleString("vi-VN",{hour:"2-digit",minute:"2-digit",day:"2-digit",month:"2-digit"})));
      box.appendChild(x)});
    box.scrollTop=box.scrollHeight;
  },()=>box.replaceChildren(mkEmpty("⚠️","Không đọc được tin nhắn.")));
}
function mkEmpty(i,t){const d=el("div","empty");d.appendChild(el("div","big",i));d.appendChild(document.createTextNode(t));return d}

$("#f").onsubmit=async e=>{
  e.preventDefault();const t=$("#in").value.trim();if(!t||!cur)return;$("#in").value="";
  try{await addDoc(collection(db,"groups",cur,"messages"),{uid:me,name:myName,text:t.slice(0,4000),ts:Date.now()})}
  catch(x){toast("Không gửi được tin nhắn.");$("#in").value=t}
};
$("#in").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();$("#f").requestSubmit()}};
/* ---------- Gửi ảnh và tệp ---------- */
const MAXF=5*1024*1024,CH=600000;
const fmtSize=n=>n<1024?n+" B":n<1048576?(n/1024).toFixed(0)+" KB":(n/1048576).toFixed(1)+" MB";
const fIcon=t=>t.startsWith("video/")?"🎬":t.startsWith("audio/")?"🎵":t.includes("pdf")?"📕":/word|document/.test(t)?"📘":/sheet|excel|csv/.test(t)?"📗":/presentation|powerpoint/.test(t)?"📙":/zip|rar|7z/.test(t)?"🗜️":"📄";
const readURL=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)});
const loadImg=u=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=u});
async function compress(f){
  const url=URL.createObjectURL(f);
  try{
    const im=await loadImg(url);let max=1280,q=.8,out="";
    for(let k=0;k<6;k++){
      const sc=Math.min(1,max/Math.max(im.width,im.height));
      const c=document.createElement("canvas");c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
      const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
      out=c.toDataURL("image/jpeg",q);
      if(out.length<800000)return out;
      max=Math.round(max*.75);q=Math.max(.5,q-.08);
    }
    return out.length<900000?out:null;
  }finally{URL.revokeObjectURL(url)}
}
let busy=false;
async function sendFiles(list){
  if(!cur||busy)return;busy=true;
  const gid=cur,cap=$("#in").value.trim(),up=$("#up");let first=true;up.hidden=false;
  try{
    for(const f of list){
      const base={uid:me,name:myName,text:first?cap.slice(0,4000):"",ts:Date.now()};
      const ref=doc(collection(db,"groups",gid,"messages"));
      if(/^image\/(jpeg|png|webp|bmp)$/.test(f.type)){
        up.textContent="Đang xử lý ảnh…";
        const d=await compress(f);
        if(!d){toast("Ảnh “"+f.name+"” quá lớn.");continue}
        await setDoc(ref,{...base,img:d});
      }else{
        if(f.size>MAXF){toast("“"+f.name+"” lớn hơn 5 MB, không gửi được.");continue}
        const b64=(await readURL(f)).split(",")[1]||"";
        const n=Math.max(1,Math.ceil(b64.length/CH));
        for(let i=0;i<n;i++){
          up.textContent="Đang gửi “"+f.name+"”… "+(i+1)+"/"+n;
          await addDoc(collection(db,"groups",gid,"messages"),{uid:me,fid:ref.id,i,d:b64.slice(i*CH,(i+1)*CH),ts:-1});
        }
        await setDoc(ref,{...base,file:{name:f.name,size:f.size,type:f.type||"application/octet-stream",parts:n}});
      }
      if(first&&cap)$("#in").value="";
      first=false;
    }
  }catch(e){toast("Không gửi được ("+(e.code||"lỗi")+").")}
  finally{busy=false;up.hidden=true}
}
async function download(gid,mid,f,btn){
  btn.disabled=true;const old=btn.textContent;btn.textContent="Đang tải…";
  try{
    const s=await getDocs(query(collection(db,"groups",gid,"messages"),where("fid","==",mid)));
    const b64=s.docs.map(d=>d.data()).sort((a,b)=>a.i-b.i).map(d=>d.d).join("");
    const blob=await (await fetch("data:"+f.type+";base64,"+b64)).blob();
    const u=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=u;a.download=f.name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),5000);
  }catch(e){toast("Không tải được tệp.")}
  finally{btn.disabled=false;btn.textContent=old}
}
function viewImg(src){
  const o=el("div","dlg"),i=el("img");i.src=src;i.style.cssText="max-width:100%;max-height:100%;border-radius:12px";
  o.appendChild(i);o.onclick=()=>o.remove();document.body.appendChild(o);
}
$("#clip").onclick=()=>$("#fi").click();
$("#fi").onchange=e=>{const l=[...e.target.files];e.target.value="";if(l.length)sendFiles(l)};
$("#in").addEventListener("paste",e=>{const l=[...(e.clipboardData&&e.clipboardData.files||[])];if(l.length){e.preventDefault();sendFiles(l)}});
$("#back").onclick=()=>openG(null);

function dlg(build){
  const o=el("div","dlg"),b=el("div");o.appendChild(b);
  o.onclick=e=>{if(e.target===o)o.remove()};
  build(b,()=>o.remove());document.body.appendChild(o);
}

$("#newg").onclick=()=>dlg((b,close)=>{
  b.appendChild(el("h2",null,"✨ Tạo nhóm mới"));
  const i=el("input");i.placeholder="Tên nhóm (vd: Ban cán sự, Quỹ lớp…)";b.appendChild(i);
  const ok=el("button","p","Tạo nhóm");
  ok.onclick=async()=>{const n=i.value.trim();if(!n)return;ok.disabled=true;
    try{const r=await addDoc(collection(db,"groups"),{name:n.slice(0,80),members:[me],owner:me,created:Date.now()});close();setTimeout(()=>openG(r.id),400)}
    catch(e){toast("Không tạo được nhóm.");ok.disabled=false}};
  i.onkeydown=e=>{if(e.key==="Enter")ok.click()};
  b.appendChild(ok);i.focus();
});

async function nameOf(id){
  if(names[id])return names[id];
  try{const s=await getDoc(doc(db,"users",id));names[id]=s.exists()?s.data().name:"Thành viên"}catch(e){names[id]="Thành viên"}
  return names[id];
}
const mask=e=>{const [a,b]=(e||"").split("@");return a?(a.slice(0,2)+"***@"+(b||"")):""};

$("#mem").onclick=()=>{
  const g=groups.find(x=>x.id===cur);if(!g)return;
  const isOwner=g.owner===me;
  dlg((b,close)=>{
    b.appendChild(el("h2",null,"👥 "+g.name));
    const list=el("div");b.appendChild(list);
    async function draw(){
      list.replaceChildren();
      for(const id of g.members){
        const c=el("span","chip",(id===me?"Bạn":await nameOf(id))+(id===g.owner?" ★":""));
        if(isOwner&&id!==me){const x=el("button",null,"×");
          x.onclick=async()=>{await updateDoc(doc(db,"groups",g.id),{members:arrayRemove(id)});g.members=g.members.filter(m=>m!==id);draw()};c.appendChild(x)}
        else c.style.paddingRight="12px";
        list.appendChild(c);
      }
    }
    draw();
    if(isOwner){
      b.appendChild(el("b",null,"Thêm thành viên"));
      const s=el("input");s.placeholder="🔍 Gõ tên người cần thêm…";b.appendChild(s);
      const res=el("div");res.style.cssText="display:flex;flex-direction:column;gap:7px";b.appendChild(res);
      let tm=null,seq=0;
      s.oninput=()=>{clearTimeout(tm);tm=setTimeout(async()=>{
        const q=norm(s.value),my=++seq;res.replaceChildren();
        if(!q)return;
        const toks=q.split(/\s+/);
        try{
          const snap=await getDocs(query(collection(db,"users"),where("keys","array-contains",toks[0].slice(0,15)),limit(25)));
          if(my!==seq)return;
          const hits=snap.docs.map(d=>({id:d.id,...d.data()})).filter(u=>!g.members.includes(u.id)&&toks.every(t=>(u.nameKey||"").includes(t)));
          if(!hits.length){res.appendChild(el("div","note","Không tìm thấy. Người đó cần đăng ký tài khoản trước và chưa ở trong nhóm."));return}
          hits.forEach(u=>{
            const h=el("div","hit");h.appendChild(avatar(u.name,u.id));
            const t=el("div","t");t.appendChild(el("b",null,u.name));t.appendChild(el("small",null,mask(u.email)));h.appendChild(t);
            const a=el("button","p sm","Thêm");
            a.onclick=async()=>{a.disabled=true;
              try{await updateDoc(doc(db,"groups",g.id),{members:arrayUnion(u.id)});names[u.id]=u.name;g.members.push(u.id);h.remove();draw();toast("Đã thêm "+u.name)}
              catch(e){toast("Không thêm được.");a.disabled=false}};
            h.appendChild(a);res.appendChild(h);
          });
        }catch(e){res.appendChild(el("div","note","Lỗi tìm kiếm ("+(e.code||"")+")."))}
      },300)};
      const del=el("button","sm","🗑 Xóa nhóm");del.style.color="#e11d48";
      del.onclick=async()=>{if(!confirm("Xóa nhóm này? Không thể hoàn tác."))return;await deleteDoc(doc(db,"groups",g.id));close()};
      b.appendChild(del);
    }else{
      const lv=el("button","sm","Rời nhóm");
      lv.onclick=async()=>{if(!confirm("Rời nhóm này?"))return;await updateDoc(doc(db,"groups",g.id),{members:arrayRemove(me)});close()};
      b.appendChild(lv);
    }
  });
};
setMode("login");
</script>
</body>
</html>
